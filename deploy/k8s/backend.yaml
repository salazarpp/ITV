apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: pokesync-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pokesync-backend
  template:
    metadata:
      labels:
        app: pokesync-backend
    spec:
      containers:
        - name: backend
          image: pokesync-backend:deployment
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pokesync-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pokesync-runtime
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pokesync-runtime
                  key: JWT_SECRET
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
