# PokeSync: architecture, decisions and AI-assisted delivery

**Authors:** jl, with AI coding assistants (Claude Code, Codex) · **Status:** delivered, latest performance change pending deployment · **Last updated:** 2026-10-08

A formatted version with rendered diagrams is available in [genai-exercise.html](genai-exercise.html). Sections 1–3 give the full picture in a few minutes; the rest is detail.

## 1. Context and scope

PokeSync is a web application for browsing Pokemon and keeping a local, editable collection.

Main use cases:

1. **Browse** Pokemon from the public PokeAPI, page by page, with details, stats and evolutions. No account needed.
2. **Save** a Pokemon into the local collection, keeping a copy of its original data.
3. **Edit** custom fields of saved Pokemon (custom name, region, classification). Requires an account.

| Who | What they need |
| --- | --- |
| Evaluators / managers | Understand what was built, how decisions were made and what is still open. |
| Developers | Understand the structure, run it, test it and change it safely. |
| Users | A fast, simple interface on desktop and mobile. |

**Out of scope** (deliberately not built): user roles, private collections per user, login rate limiting, token refresh or revocation, and automatic refresh of saved Pokemon data.

## 2. System context

```mermaid
flowchart LR
    U([User<br/>browser, desktop or mobile]) --> PS[PokeSync<br/>web app + API]
    PS --> API[(PokeAPI<br/>public Pokemon data)]
    PS --> DB[(PostgreSQL<br/>users, saved Pokemon)]
```

PokeSync sits between the user and PokeAPI. It reads public data from PokeAPI and stores only what the user saves, plus user accounts.

## 3. Quality goals

The five qualities that drove the design, in priority order.

| # | Goal | Concrete scenario | Status |
| --- | --- | --- | --- |
| 1 | Maintainability | Replacing the database or PokeAPI client does not change business rules. | Met by design: four independent layers |
| 2 | Security | Without a valid token, the local collection cannot be read or changed. | Met: enforced and covered by tests |
| 3 | Performance | A page of 20 Pokemon loads in under one second. | Improved from 4.63 s to 1.05 s (measured). Under one second estimated; measurement pending |
| 4 | Testability | Every layer is tested; the real database is used in integration tests. | Met: 71 backend tests, 14 frontend unit tests, 3 browser scenarios |
| 5 | Deployability | One command starts the app; every change to main is tested before release. | Met: Docker Compose and CI pipeline |

## 4. Architecture

```mermaid
flowchart LR
    U[Browser] --> N[nginx<br/>React app + proxy]
    N --> P
    subgraph API[Spring Boot API]
        direction TB
        P[Presentation<br/>controllers, errors] --> A[Application<br/>services, ports]
        A --> D[Domain<br/>models]
        I[Infrastructure<br/>JPA, HTTP client, BCrypt, JWT] -. implements ports .-> A
    end
    I --> DB[(PostgreSQL)]
    I --> EXT[PokeAPI]
```

The business core does not depend on the database, the web framework or PokeAPI. Any of those can change without rewriting the rules.

| Layer | Responsibility |
| --- | --- |
| Domain | Users, Pokemon, local records, paginated results. No framework code. |
| Application | Registration, login, browsing, local collection. Defines ports (interfaces) for what it needs. |
| Infrastructure | Implements the ports: PostgreSQL (JPA), PokeAPI (HTTP), BCrypt, JWT. |
| Presentation | HTTP routes, request validation, consistent error responses. |

| Route | Access |
| --- | --- |
| `POST /auth/register`, `POST /auth/login` | Public |
| `GET /api/v1/pokemon`, `GET /api/v1/pokemon/{id}` | Public |
| API docs, health | Public |
| `/api/v1/local-pokemon` (create, list, read, update, delete) | Requires a valid token |

**Stack:** Java 21 + Spring Boot, React 19 + TypeScript, PostgreSQL 17, nginx, Docker, GitHub Actions.

## 5. Key decisions and alternatives considered

Every decision was based on evidence: code, logs, measurements or official documentation.

| Decision | Alternatives considered | Why |
| --- | --- | --- |
| Clean Architecture in four layers | Controllers calling the database directly | Business rules stay testable without Spring, HTTP or the database. The assessment asks for independent layers. |
| PostgreSQL with Flyway migrations | In-memory database, automatic schema generation | A real relational store with a versioned, reviewable schema. |
| Stateless JWT authentication | Server-side sessions | Frontend and backend run separately; no session state to share. |
| Token kept in browser memory | Browser storage | No persistent token on disk. Cost: login again after a page refresh. |
| Store the PokeAPI snapshot plus separate custom fields | Normalize every PokeAPI structure | Original data is preserved; custom edits never overwrite it. |
| Bounded caches | No cache, or unlimited cache | PokeAPI asks clients to cache. Limits keep memory under control. |
| Bounded parallel fetching | Unlimited concurrency, PokeAPI GraphQL | Faster without flooding PokeAPI. GraphQL is beta and its stability was not verified. |
| Docker Compose on the home lab server | Kubernetes | The server already runs Compose; its Kubernetes service is inactive. Manifests are kept as an alternative. |
| Tests and images on GitHub-hosted runners, deploy on the home lab runner | Everything on the home lab server | The home lab lacks the build toolchain. This matches the other apps on that server. |

Rejected after investigation: fetching species data in parallel by assuming the species ID equals the Pokemon ID. This is false for alternative forms (IDs above 10000).

## 6. Cross-cutting concerns

### Security

```mermaid
sequenceDiagram
    actor User
    participant Web as React app
    participant API as Spring Boot
    participant DB as PostgreSQL
    User->>Web: username + password
    Web->>API: POST /auth/login
    API->>DB: find user
    API->>API: BCrypt compare (dummy hash if user unknown)
    API-->>Web: JWT (HS256, expires)
    Note over Web: token kept in memory only
    Web->>API: request + Authorization: Bearer token
    API->>API: verify signature, issuer, expiry, subject
    API-->>Web: 200, or 401 with standard error body
```

Passwords are never stored in readable form, tokens expire, and every protected request is checked.

| Control | How |
| --- | --- |
| Passwords | BCrypt hashes. Passwords over 72 bytes are rejected, not silently truncated. |
| Login errors | One generic message. A dummy hash comparison reduces the difference between "unknown user" and "wrong password". |
| Tokens | HS256, signing key of at least 32 bytes from configuration. Issuer, expiry and subject required. |
| Sessions | Stateless. No server sessions, form login or HTTP Basic. CSRF disabled because no cookies authenticate requests. |
| Secrets | Supplied at runtime. Never in source code, images or frontend assets. Database and JWT secrets kept separate. |
| Demo account | Created only when the `demo` profile is explicitly enabled. |

### Errors

Every failure returns the same JSON shape, so the frontend handles all errors one way:

```json
{ "status": 404, "code": "...", "message": "...", "timestamp": "...", "requestId": "..." }
```

| Status | Meaning |
| --- | --- |
| 400 | Invalid input |
| 401 / 403 | Missing or invalid token / access denied |
| 404 | Record not found |
| 409 | Duplicate user or Pokemon already saved |
| 502 / 504 | PokeAPI failed / timed out |
| 500 | Unexpected error, without internal details |

### Observability

- Every request gets a correlation ID (`X-Request-ID`). It is returned in the response and appears in every log line, so a user-reported error can be traced to the backend logs.
- Logs record start, end, status and duration of each request, PokeAPI calls and cache decisions (hit, miss, shared wait).
- Logs never contain request bodies, passwords, tokens or query strings.
- `/actuator/health` reports whether the application is up.

## 7. Testing

```mermaid
flowchart BT
    U[Unit tests<br/>business rules, security, logging<br/>JUnit 5 + Mockito, Vitest]
    W[Web layer tests<br/>routes, validation, JWT<br/>MockMvc]
    I[Integration tests<br/>full app + real PostgreSQL<br/>Testcontainers]
    E[Browser tests<br/>user flows on desktop and mobile<br/>Playwright]
    U --> W --> I --> E
```

Many fast tests at the base, fewer and broader tests at the top. Each level catches a different kind of mistake.

| Type | Tool | What it proves | Tests |
| --- | --- | --- | --- |
| Backend unit | JUnit 5, Mockito, AssertJ | Services, repositories, password hashing and logging behave correctly in isolation | 30 |
| PokeAPI client | MockRestServiceServer, local HTTP server | Responses are mapped, errors translated, parallel calls ordered and deduplicated | 10 |
| Web layer | `@WebMvcTest` + MockMvc | Routes, status codes, validation, JWT protection | 22 |
| Integration | `@SpringBootTest` + Testcontainers (PostgreSQL 17) + PokeAPI fixture | The whole backend works with a real database and migrations | 9 |
| Frontend unit | Vitest | API client and page cache (expiry, capacity, cancellation) | 14 |
| Browser | Playwright, desktop Chrome and Pixel 7 | Browse, register, sign in, save, edit, delete; error recovery; session expiry | 3 scenarios × 2 devices |

Counts are tests written in the code, not executions.

How we test:

1. The AI writes or updates tests together with each change.
2. jl runs the tests locally. The AI never runs them.
3. CI runs everything on every push: `mvn verify` (unit + integration), type check, build and browser tests.
4. Test reports are kept even when a job fails.

Browser tests use simulated API responses so they do not depend on PokeAPI being available. They check the interface, not the live backend.

## 8. API documentation

The API documents itself from the code (OpenAPI), so the documentation always matches what is deployed.

| What | Where |
| --- | --- |
| Swagger UI (try the API in the browser) | `/swagger-ui/index.html` |
| OpenAPI JSON | `/v3/api-docs` |
| OpenAPI YAML | `/v3/api-docs.yaml` |

- Public and protected routes are marked. Click **Authorize** in Swagger UI and paste the `accessToken` returned by login.
- Request and response models, error responses and the `X-Request-ID` header are documented.
- **Postman:** *Import → Link* and paste the `/v3/api-docs` URL. Postman builds a collection with every route.
- **Demo data:** start with the `demo` profile to get a demo account and a saved Pokemon (credentials in the README).

## 9. Delivery and operations

```mermaid
flowchart LR
    G[Push to main] --> B[Backend job<br/>unit + PostgreSQL integration tests]
    G --> F[Frontend job<br/>unit, type check, browser tests]
    B --> I[Images<br/>published, tagged by commit]
    F --> I
    I --> D{Deploy enabled?}
    D -- yes --> H[Home lab runner<br/>Docker Compose + health check]
```

Every change is tested automatically. Only a fully green build is packaged and deployed, and backend and frontend always ship from the same commit.

- **Run locally:** `docker compose up --build` starts PostgreSQL, backend and frontend.
- **Configuration:** environment variables. Required secrets (database password, JWT key) have no defaults.
- **Database changes:** versioned Flyway migrations; the app validates the schema at startup.

## 10. How we built it with AI

```mermaid
flowchart LR
    A[jl brings a need] --> B[AI investigates<br/>code, notes, official docs]
    B --> C[AI writes a plan<br/>in shared notes]
    C --> D{jl reviews}
    D -- adjust --> C
    D -- approve --> E[AI implements<br/>in small steps]
    E --> F[Static checks<br/>compile, lint, build]
    F --> G[jl runs tests<br/>CI validates]
    G -- fails --> E
    G -- passes --> H[Result recorded]
```

The AI does the legwork; jl makes every decision. Nothing is executed until jl approves the plan.

1. **Investigate before acting.** Read the code, the project notes and the official documentation first.
2. **Plan in writing.** Every task has a note with numbered steps. If a session stops, another one continues from the note.
3. **jl approves.** Plans are adjusted until jl agrees. Questions or partial agreement do not count as approval.
4. **Small, verifiable steps.** Each step is checked (compilation, lint, build) before the next one.
5. **Clear limits.** The AI does not run tests, query databases or read secrets.
6. **Honest numbers.** Every claim is labelled as measured, estimated or unknown.

## 11. Case study: Pokemon list from 4.6 seconds to about one second

**The problem:** to show a page of 20 Pokemon, the backend made 41 calls to PokeAPI, one after another.

```mermaid
flowchart LR
    subgraph Before[Before: one at a time]
        direction LR
        L1[Page list] --> P1[Pokemon 1] --> S1[Species 1] --> P2[Pokemon 2] --> S2[Species 2] --> X[... 20 times]
    end
    subgraph After[After: all at once]
        direction LR
        L2[Page list] --> W[20 workers in parallel<br/>Pokemon + Species]
        W --> R[Ordered page]
    end
```

```mermaid
xychart-beta
    title "First-page load time (seconds)"
    x-axis ["Original (measured)", "4 workers (measured)", "20 workers (estimated)", "Cached (measured)"]
    y-axis "Seconds" 0 --> 5
    bar [4.63, 1.05, 0.8, 0.015]
```

| Step | Commit | Change | Result |
| --- | --- | --- | --- |
| 0 | `7ff6540` | Starting point. A cache of PokeAPI responses already existed (256 entries, 5 minutes). Each Pokemon fetched one after another. | 4.63 s for an uncached page (measured; backend log 4622 ms) |
| 1 | `4714a78` | **4 parallel workers** with a bounded queue. Identical calls in progress are shared instead of repeated. | 1.05–1.6 s (measured; single requests, cache state unknown) |
| 2 | `78a02b4` | **Browser page cache**: the last 10 visited pages are kept for 5 minutes. Cache hit/miss logs added. | Revisiting a page needs no request (not timed) |
| 3 | `ca87246` | **20 workers**: a full page is fetched in a single round. **Summary cache** per Pokemon (2,048 entries, 24 hours). | 0.5–0.8 s (estimated; deployment and measurement pending) |

When the backend cache is warm, list requests completed in 7–15 ms (measured in server logs).

Safeguards: worker count and queue are bounded so PokeAPI is not flooded; failed responses are never cached; there are no automatic retries; results keep PokeAPI order and each request's correlation ID.

## 12. Assessment exercise: task-management API

The assessment asks for a prompt for a GenAI coding tool, the output code, and how the output was validated, corrected and protected. The scaffold lives in [`docs/genai/TaskController.java`](genai/TaskController.java), outside the PokeSync build. The tool used was Codex.

### Prompt

```text
Generate a representative Java 21 / Spring Boot task-management REST API scaffold with create, list, get, update and delete operations under /api/v1/tasks. Each task has title, description, status and due_date and is associated with an existing user. Assume JWT authentication and the user model already exist. Resolve ownership from the authenticated JWT subject, validate request fields, use standard HTTP responses, scope every lookup/update/delete by owner and task ID, and show controller, DTOs, status enum and persistence port. Clearly identify missing adapters/security/error wiring and meaningful tests. Do not claim compilation, execution or tests that were not performed.
```

### Design

```mermaid
erDiagram
    USER ||--o{ TASK : owns
    USER {
        uuid id
        string username
    }
    TASK {
        uuid id
        uuid user_id
        string title
        string description
        string status
        date due_date
    }
```

```mermaid
sequenceDiagram
    participant C as Client
    participant T as TaskController
    participant S as OwnedTaskStore
    C->>T: GET /api/v1/tasks/{id} + Bearer token
    alt no valid subject in token
        T-->>C: 401 Unauthorized
    else valid token
        T->>S: find(owner from token, id)
        alt task belongs to this user
            S-->>T: task
            T-->>C: 200 OK
        else missing or owned by someone else
            S-->>T: empty
            T-->>C: 404 Not Found
        end
    end
```

A user can only see and change their own tasks. Another user's task looks exactly like a missing one.

Status values are `TODO`, `IN_PROGRESS` and `DONE`. No transition rules are enforced; the assessment does not define any.

| Operation | Route | Success |
| --- | --- | --- |
| Create | `POST /api/v1/tasks` | `201 Created` + `Location` |
| List own tasks | `GET /api/v1/tasks` | `200 OK` |
| Read | `GET /api/v1/tasks/{id}` | `200 OK` |
| Replace | `PUT /api/v1/tasks/{id}` | `200 OK` |
| Delete | `DELETE /api/v1/tasks/{id}` | `204 No Content` |

### Output (representative excerpt)

```java
@RestController
@RequestMapping("/api/v1/tasks")
public class TaskController {
    private final OwnedTaskStore tasks;

    @PostMapping
    ResponseEntity<Task> create(@AuthenticationPrincipal Jwt principal, @Valid @RequestBody TaskInput input) {
        Task task = tasks.create(owner(principal), input);
        return ResponseEntity.created(URI.create("/api/v1/tasks/" + task.id())).body(task);
    }

    @GetMapping("/{id}")
    Task find(@AuthenticationPrincipal Jwt principal, @PathVariable UUID id) {
        return tasks.find(owner(principal), id).orElseThrow(TaskController::missing);
    }

    public enum Status { TODO, IN_PROGRESS, DONE }
    public record TaskInput(@NotBlank @Size(max = 255) String title,
                            @NotNull @Size(max = 4000) String description,
                            @NotNull Status status, @NotNull LocalDate due_date) {}

    /** Implementations must scope every query and mutation by both owner and task ID. */
    public interface OwnedTaskStore {
        List<Task> list(UUID owner);
        Optional<Task> find(UUID owner, UUID id);
        Task create(UUID owner, TaskInput input);
        Optional<Task> update(UUID owner, UUID id, TaskInput input);
        boolean delete(UUID owner, UUID id);
    }
}
```

The full file also contains list, update, delete, the owner helper and the response record.

### How the output was validated

| Check | Result |
| --- | --- |
| All five CRUD routes present with correct verbs and statuses | Pass |
| All four fields (`title`, `description`, `status`, `due_date`) validated | Pass |
| Owner taken from the JWT subject, never from the request body | Pass |
| Every read, update and delete scoped by owner and task ID | Pass |
| Token subject format matches PokeSync (user UUID) | Pass, checked against PokeSync's token issuer |
| Update never creates a missing task | Pass in controller; the storage adapter must respect it |

Method: static review of the code. The sample was not compiled or run; it is outside the PokeSync build.

### Corrections and improvements

Review findings on the generated code (not yet applied to the sample):

1. `due_date` is used as a Java field name. Idiomatic Java is `dueDate` with `@JsonProperty("due_date")` to keep the JSON contract.
2. The owner helper catches `NullPointerException` to detect a missing subject. An explicit null/blank check is clearer.

### Edge cases, authentication and validation

| Case | Expected behavior |
| --- | --- |
| No token, invalid token, or subject that is not a UUID | `401` |
| Another user's task ID | `404`, same as a missing task |
| Missing task on read, update or delete | `404`; update never inserts |
| Blank title, title over 255, description over 4,000 | `400` |
| Missing or unknown status, malformed date or ID, malformed JSON | `400` |
| Past due date | Accepted; no scheduling rule was requested |
| User with no tasks | `200` with an empty list |

To make it runnable: a storage adapter and migration with a user foreign key, the existing JWT security chain, and the shared error handler. Recommended tests: two-user isolation across all operations, validation boundaries, and a create–read–update–delete–404 scenario.

## 13. Risks and open items

| Item | Impact | Next step |
| --- | --- | --- |
| First-load latency under one second is an estimate | Performance goal not yet proven | Deploy `ca87246` and measure `GET /api/v1/pokemon` |
| Tests for the latest changes not yet run | Regressions possible until run | jl runs the tests; CI confirms on push |
| Caches live in each backend process | Lost on restart; not shared between replicas | Acceptable for one instance; revisit if scaled out |
| No login rate limiting, token refresh or revocation | Weaker protection against password guessing; re-login after expiry | Add if the app is exposed publicly |
| Task-management scaffold not compiled or run | Exercise code is a sample, not a product | Add adapter, migration and tests if it becomes a feature |

## 14. Glossary

| Term | Meaning |
| --- | --- |
| API | The interface the frontend (or Postman) uses to talk to the backend. |
| PokeAPI | Free public service with Pokemon data. PokeSync reads from it. |
| JWT / token | A signed, expiring pass the user receives at login and sends with each protected request. |
| BCrypt | A slow, one-way function used to store passwords safely. |
| Cache | A short-term memory of previous answers, so they are not fetched again. |
| Worker | A background thread that fetches data in parallel with others. |
| CI | Continuous integration: automatic tests on every change. |
| OpenAPI / Swagger | A machine-readable description of the API and a web page to try it. |
| Correlation ID | A unique ID per request, used to find it in the logs. |
| Testcontainers | A library that starts a real, disposable database for tests. |
